name: CI Pipeline

# 1. The Trigger: When does this run?
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your code onto the GitHub server
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install the Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Install packages
      # We use 'npm ci' (Clean Install) instead of 'npm install' in DevOps
      # to guarantee exact package versions are used.
      - name: Install Dependencies
        run: npm ci

      # Step 4: Run your Jest Unit & Component Tests
      - name: Run Jest Tests
        run: npm run test

      # Step 5: Run End-to-End Tests with Cypress
      # This official action automatically builds Next.js, starts the server,
      # waits for it to be ready, runs Cypress, and safely shuts it down.
      - name: Run Cypress E2E Tests
        uses: cypress-io/github-action@v6
        with:
          build: npm run build
          start: npm run start
          wait-on: 'http://localhost:3000'
        env:
          # Inject the secrets we saved in GitHub Settings
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}